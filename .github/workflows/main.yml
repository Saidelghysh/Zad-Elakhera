name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter create . --platforms=android --project-name=zad_alakhira --org=com.zadalakhira

      - name: Opt out of AGP 9's new DSL (official Google workaround until plugins catch up)
        run: |
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties
          echo "----- android/gradle.properties result: -----"
          cat android/gradle.properties

      - name: Force newer Android compileSdk/targetSdk (34+ required by some plugins)
        run: |
          sed -i -E 's/^([[:space:]]*)compileSdk[[:space:]]*=?.*/\1compileSdk = 36/' android/app/build.gradle.kts
          sed -i -E 's/^([[:space:]]*)targetSdk[[:space:]]*=?.*/\1targetSdk = 36/' android/app/build.gradle.kts
          echo "----- app/build.gradle.kts result: -----"
          grep -n "compileSdk\|targetSdk" android/app/build.gradle.kts

      - name: Force compileSdk 36 for ALL plugin subprojects too
        run: |
          cat >> android/build.gradle.kts << 'GRADLE_EOF'

          subprojects {
              afterEvaluate {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.let {
                      it.compileSdkVersion(36)
                  }
              }
          }
          GRADLE_EOF
          echo "----- android/build.gradle.kts result: -----"
          tail -n 15 android/build.gradle.kts

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: zad-alakhira-apk
          path: build/app/outputs/flutter-apk/app-release.apk