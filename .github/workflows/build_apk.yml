name: Build Zad Alakhira Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --project-name=zad_alakhira --org=com.zadalakhira

      - name: Get packages
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>'''
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + '\n    ' + permissions)
          if '<queries>' not in s:
              queries = '''<queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW"/>
                      <category android:name="android.intent.category.BROWSABLE"/>
                      <data android:scheme="https"/>
                  </intent>
              </queries>'''
              s = s.replace('</manifest>', queries + '\n</manifest>')
          p.write_text(s)
          PY

      - name: Enable notification desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY

      - name: Configure Play signing when secrets are available
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ZAD_KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.ZAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/zad-alakhira-release.jks
          cat > android/key.properties <<EOF2
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=zad-alakhira-release.jks
          EOF2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          header='''import java.util.Properties\nimport java.io.FileInputStream\n\nval keystorePropertiesFile = rootProject.file("key.properties")\nval keystoreProperties = Properties()\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n'''
          if not s.startswith('import java.util.Properties'):
              s=header+s
          signing='''    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n'''
          if 'signingConfigs {' not in s:
              s=s.replace('android {', 'android {\n'+signing, 1)
          s=s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Play Store AAB
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zad-alakhira-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: zad-alakhira-play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
