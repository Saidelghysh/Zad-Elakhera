name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter create . --platforms=android --project-name=zad_alakhira --org=com.zadalakhira

      - name: Opt out of AGP 9 new DSL (official Google workaround, safe and documented)
        run: |
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: zad-alakhira-apk
          path: build/app/outputs/flutter-apk/app-release.apk
