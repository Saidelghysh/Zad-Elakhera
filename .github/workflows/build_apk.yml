name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter create . --platforms=android --project-name=zad_alakhira --org=com.zadalakhira

      - name: Opt out of AGP 9 new DSL (official Google workaround, safe and documented)
        run: |
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties

      - name: Add required Android permissions (location, internet, notifications)
        run: |
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>#' android/app/src/main/AndroidManifest.xml
          echo "----- AndroidManifest.xml result: -----"
          cat android/app/src/main/AndroidManifest.xml

      - name: Enable core library desugaring (required by flutter_local_notifications)
        run: |
          sed -i -E 's/^([[:space:]]*)compileOptions[[:space:]]*\{/\1compileOptions {\n\1    isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts << 'GRADLE_EOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          GRADLE_EOF
          echo "----- app/build.gradle.kts result: -----"
          cat android/app/build.gradle.kts

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: zad-alakhira-apk
          path: build/app/outputs/flutter-apk/app-release.apk
