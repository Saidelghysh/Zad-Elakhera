name: zad_alakhira
description: >
  زاد الآخرة - صدقة جارية على روح الحاج عبدالحميد إبراهيم الغايش رحمه الله.
  تطبيق إسلامي فاخر (قرآن، تلاوات، تفسير، أوقات صلاة، قبلة، أذكار، تسبيح، تجويد، تعلم الصلاة).
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cupertino_icons: ^1.0.8
  adhan_dart: ^2.0.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  dio: ^5.6.0
  animate_do: ^3.3.4
  lottie: ^3.1.2
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  just_audio: ^0.9.42
  flutter_compass: ^0.8.1
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: '#04060D'
  adaptive_icon_foreground: assets/icon/app_icon.png
