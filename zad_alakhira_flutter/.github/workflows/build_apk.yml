name: Build APK

# يشتغل هذا الملف تلقائيًا كل مرة ترفع فيها تعديل (push) على المستودع.
# النتيجة: ملف APK جاهز للتثبيت، بدون ما تحتاج تثبت Flutter أو Android Studio
# على جهازك — كل البناء يصير على سيرفرات GitHub مجانًا.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: توليد مجلدات android/ios الناقصة
        run: flutter create . --platforms=android

      - name: تنزيل المكتبات
        run: flutter pub get

      - name: بناء APK (نسخة Release جاهزة للتثبيت)
        run: flutter build apk --release

      - name: رفع الـ APK كـ Artifact (تقدر تنزّله من تبويب Actions)
        uses: actions/upload-artifact@v4
        with:
          name: zad-alakhira-apk
          path: build/app/outputs/flutter-apk/app-release.apk
